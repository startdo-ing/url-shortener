name: Deploy Redirect Service to Home Server

on:
  push:
    branches: ["main"]
    paths:
      - 'apps/redirect-service/**'
      - 'packages/shared-db/**'
      - 'docker-compose.yml'
      - '.github/workflows/deploy-redirect-service.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: [self-hosted, home]
    env:
      HOME_SERVER_URL_SHORTENER_PATH: ${{ secrets.HOME_SERVER_URL_SHORTENER_PATH }}
    steps:
      - name: 1. Deploy Redirect Service locally
        run: |
          test -n "$HOME_SERVER_URL_SHORTENER_PATH"

          cd "$HOME_SERVER_URL_SHORTENER_PATH"
          git pull
          docker compose build redirect-service
          docker compose up -d redirect-service

      - name: 2. Verify Deployment
        run: |
          docker compose -f "$HOME_SERVER_URL_SHORTENER_PATH/docker-compose.yml" ps redirect-service

          echo "✅ Redirect Service deployed successfully"
